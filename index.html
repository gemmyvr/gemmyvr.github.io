<!DOCTYPE html>
<html>
  <head>
    <title>Gemmy's Website</title>
    <style>
      /* Style the whole page background and font */
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #74b9ff, #a29bfe);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Create a nice content box */
      .card {
        background-color: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
        max-width: 400px;
      }

      /* Style the heading text */
      h1 {
        color: #2d3436;
        font-size: 24px;
        margin-bottom: 10px;
      }

      /* Style the paragraph text */
      p {
        color: #636e72;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World!</h1>
      <p>Welcome to my website hosted on GitHub.</p>
    </div>
  </body>
</html>
